name = "ai-mock-interview"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

# KV: `npx wrangler kv namespace create IV_KV` 후 id를 채우세요.
[[kv_namespaces]]
binding = "IV_KV"
id = "8b8d944e356845078ece1c9b81cad409"

[vars]
KAKAOPAY_URL = "https://qr.kakaopay.com/Ej7lelIaG"
FAIRY_URL = ""
# Cost control: no interview count limit; AI spend is capped per session (quick $0.15, full $0.50, sized for Claude Sonnet 5.5) and per day ($10).
DAILY_BUDGET_USD = "10"
SESSION_BUDGET_QUICK_USD = "0.15"
SESSION_BUDGET_FULL_USD = "0.50"
# Claude (first): the ANTHROPIC_API_KEY secret (a service account key) is set in Cloudflare; tried before Gemini.
CLAUDE_MODELS = "claude-sonnet-5-5"
# Gemini (direct): the GEMINI_API_KEY secret is set in Cloudflare; tried after Claude, in order.
GEMINI_MODELS = "gemini-2.5-flash-lite,gemini-3.5-flash-lite"
# paid: token costs are priced into the usage ledger and budgets (free tier would record $0).
GEMINI_TIER = "paid"
PAID_OVERFLOW = "on"
# Cheap paid backups, tried in order when free models fail or exceed the free time budget (needs OpenRouter credits).
PAID_MODEL = "qwen/qwen3.7-flash,deepseek/deepseek-v4.1-flash"
# Monthly cap on paid calls (about 18 calls per interview).
PAID_MONTHLY_CALLS = "20000"
PREFERRED_MODELS = "nemotron-3.5-super,nemotron-3-ultra,dots-3,nemotron-3-nano,gemma-4"
TURNSTILE_SITEKEY = "0x4AAAAAAFt3SH_C6OTYRDOB"
